/* ===========================================================
   Single-active audio manager
   =========================================================== */
const AudioBus = (() => {
  const listeners = new Set();
  let active = null;
  return {
    setActive(id) {
      if (active && active !== id) {
        listeners.forEach((fn) => fn(active === id ? id : null, id));
      }
      active = id;
      listeners.forEach((fn) => fn(active, id));
    },
    clear(id) { if (active === id) active = null; },
    subscribe(fn) { listeners.add(fn); return () => listeners.delete(fn); }
  };
})();

function genWaveform(seed, bars) {
  const arr = new Array(bars);
  let s = seed;
  for (let i = 0; i < bars; i++) {
    s = (s * 1103515245 + 12345) & 0x7fffffff;
    const r = (s % 1000) / 1000;
    const t = i / (bars - 1);
    const env =
      0.25 +
      0.7 * Math.sin(Math.PI * t) +
      0.2 * Math.sin(Math.PI * t * 6) +
      0.1 * Math.sin(Math.PI * t * 13);
    const v = Math.max(0.08, Math.min(1, (0.35 + r * 0.7) * (0.4 + Math.abs(env) * 0.6)));
    arr[i] = v;
  }
  return arr;
}

function fmt(t) {
  if (!isFinite(t) || t < 0) t = 0;
  const m = Math.floor(t / 60);
  const s = Math.floor(t % 60);
  return `${m}:${s.toString().padStart(2, "0")}`;
}

/* ===========================================================
   AudioPlayer
   =========================================================== */
function AudioPlayer({ id, src, seed = 1, bars = 96, fallbackDuration = 75 }) {
  const audioRef = React.useRef(null);
  const waveRef = React.useRef(null);
  const [playing, setPlaying] = React.useState(false);
  const [current, setCurrent] = React.useState(0);
  const [duration, setDuration] = React.useState(fallbackDuration);
  const [dragging, setDragging] = React.useState(false);

  const waveform = React.useMemo(() => genWaveform(seed, bars), [seed, bars]);

  React.useEffect(() => {
    const unsub = AudioBus.subscribe((activeId) => {
      if (activeId !== id && audioRef.current && !audioRef.current.paused) {
        audioRef.current.pause();
      }
    });
    return unsub;
  }, [id]);

  React.useEffect(() => {
    const a = audioRef.current;
    if (!a) return;
    const onTime = () => !dragging && setCurrent(a.currentTime);
    const onDur = () => {
      if (isFinite(a.duration) && a.duration > 0) setDuration(a.duration);
    };
    const onEnd = () => {
      setPlaying(false);
      setCurrent(0);
      AudioBus.clear(id);
    };
    const onPlay = () => { setPlaying(true); AudioBus.setActive(id); };
    const onPause = () => setPlaying(false);
    a.addEventListener("timeupdate", onTime);
    a.addEventListener("loadedmetadata", onDur);
    a.addEventListener("durationchange", onDur);
    a.addEventListener("ended", onEnd);
    a.addEventListener("play", onPlay);
    a.addEventListener("pause", onPause);
    return () => {
      a.removeEventListener("timeupdate", onTime);
      a.removeEventListener("loadedmetadata", onDur);
      a.removeEventListener("durationchange", onDur);
      a.removeEventListener("ended", onEnd);
      a.removeEventListener("play", onPlay);
      a.removeEventListener("pause", onPause);
    };
  }, [id, dragging]);

  const toggle = () => {
    const a = audioRef.current;
    if (!a) return;
    if (a.paused) {
      a.play().catch(() => {});
    } else {
      a.pause();
    }
  };

  const seekFromEvent = (e) => {
    const el = waveRef.current;
    if (!el) return;
    const rect = el.getBoundingClientRect();
    const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
    const pct = Math.max(0, Math.min(1, x / rect.width));
    setCurrent(pct * duration);
    if (audioRef.current) audioRef.current.currentTime = pct * duration;
  };

  const onWaveMouseDown = (e) => {
    setDragging(true);
    seekFromEvent(e);
  };
  React.useEffect(() => {
    if (!dragging) return;
    const move = (e) => seekFromEvent(e);
    const up = () => setDragging(false);
    window.addEventListener("mousemove", move);
    window.addEventListener("mouseup", up);
    window.addEventListener("touchmove", move, { passive: false });
    window.addEventListener("touchend", up);
    return () => {
      window.removeEventListener("mousemove", move);
      window.removeEventListener("mouseup", up);
      window.removeEventListener("touchmove", move);
      window.removeEventListener("touchend", up);
    };
  }, [dragging]);

  const progress = duration > 0 ? current / duration : 0;

  return (
    <div className="player">
      <audio ref={audioRef} src={src} preload="metadata"></audio>
      <button
        className={`player-play ${playing ? "playing" : ""}`}
        onClick={toggle}
        aria-label={playing ? "Pause" : "Abspielen"}
      >
        <span className={playing ? "icon-pause" : "icon-play"}></span>
      </button>
      <div className="player-body">
        <div
          className="player-waveform"
          ref={waveRef}
          onMouseDown={onWaveMouseDown}
          onTouchStart={onWaveMouseDown}
        >
          <svg viewBox={`0 0 ${bars * 2} 100`} preserveAspectRatio="none">
            {waveform.map((v, i) => {
              const h = v * 96;
              const y = (100 - h) / 2;
              const isPlayed = i / bars < progress;
              return (
                <rect
                  key={i}
                  className={`wave-bar ${isPlayed ? "is-played" : ""}`}
                  x={i * 2 + 0.4}
                  y={y}
                  width={1.2}
                  height={h}
                  rx={0.6}
                />
              );
            })}
          </svg>
          <div
            className="wave-progress"
            style={{ left: `${progress * 100}%` }}
          ></div>
        </div>
        <div className="player-time">
          <span className="current">{fmt(current)}</span>
          <span>{fmt(duration)}</span>
        </div>
      </div>
    </div>
  );
}

            <select className="form-select" id="cf-project" value={form.project} onChange={upd("project")}>
              <option>Werbung</option>
              <option>Erzähler / Doku</option>
              <option>Hörspiel</option>
              <option>Synchron</option>
              <option>Trailer</option>
              <option>Sonstiges</option>
            </select>
          </div>
          <div className="form-group">
            <label className="form-label" htmlFor="cf-deadline">Deadline (optional)</label>
            <input className="form-input" id="cf-deadline" type="text" value={form.deadline} onChange={upd("deadline")} placeholder="z.B. nächste Woche / 12.06." />
          </div>
          <div className="form-group">
            <label className="form-label" htmlFor="cf-brief">Briefing in zwei Sätzen</label>
            <textarea className="form-textarea" id="cf-brief" value={form.brief} onChange={upd("brief")} placeholder="Worum geht's? Tonalität, Länge, Lieferdatum…"></textarea>
          </div>
          <button type="submit" className="btn btn-primary form-submit">
            Anfrage senden <span className="arrow">→</span>
          </button>
          {status && (
            <div className="form-status" style={status.kind === "err" ? {color:"#ff8d6a"} : {}}>
              {status.msg}
            </div>
          )}
        </form>
      </div>
    </section>
  );
}

/* ===========================================================
   SCROLL REVEAL + APP
   =========================================================== */
function ScrollRevealRoot({ children }) {
  React.useEffect(() => {
    const els = document.querySelectorAll(".reveal, .reveal-stagger");
    const io = new IntersectionObserver(
      (entries) => {
        entries.forEach((e) => {
          if (e.isIntersecting) {
            e.target.classList.add("in");
            io.unobserve(e.target);
          }
        });
      },
      { threshold: 0.14, rootMargin: "0px 0px -8% 0px" }
    );
    els.forEach((el) => io.observe(el));
    return () => io.disconnect();
  }, []);
  return children;
}

function App() {
  return (
    <ScrollRevealRoot>
      <Nav />
      <main>
        <Hero />
        <Showreel />
        <About />
        <Stimmproben />
        <Refs />
        <Specs />
        <Contact />
      </main>
      <Foot />
    </ScrollRevealRoot>
  );
}

const root = ReactDOM.createRoot(document.getElementById("app"));
root.render(<App />);
